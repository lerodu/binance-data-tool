[project]
name = "mktdata"
version = "0.1.0"
description = "Acquire exchange market data: historical candles and live order-book capture"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tqdm>=4.66",
    "websocket-client>=1.7",
]

[project.scripts]
mktdata = "mktdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mktdata"]
