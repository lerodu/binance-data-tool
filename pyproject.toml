[project]
name = "binance-data-tool"
version = "0.1.0"
description = "Download and consolidate Binance spot klines from data.binance.vision"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tqdm>=4.66",
    "websocket-client>=1.7",
]

[project.scripts]
binance-data = "binance_data_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["binance_data_tool"]
